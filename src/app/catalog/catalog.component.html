@if (flowers !== undefined) {
    @for (f of flowers; track f.id) {
      <p>
        <span class="flower_label">{{ f.label }}</span><br>
        <a (click)="onFlowerSelect(f)">
          <img class="thumb"
               [src]="f.smallImgSrc" [alt]="f.label">
        </a>
      </p>
    }
} @else {
  <p class="message">
    The data is not found.
  </p>
}
